<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Match — WC2026 Predictor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tw.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
</head>
<body>
<div id="nav"></div>

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-8" id="root">
  <div class="skeleton h-32 rounded-2xl mb-6"></div>
  <div class="grid md:grid-cols-2 gap-5">
    <div class="skeleton h-48 rounded-2xl"></div>
    <div class="skeleton h-48 rounded-2xl"></div>
  </div>
</main>

<div id="footer"></div>

<script type="module">
import { mountLayout, api, escapeHtml, $, probBar, fmtDateVN, loadTeams, tournamentBadge } from '/js/shared.js?v=15';
mountLayout('/match');

const matchId = parseInt(window.location.pathname.split('/match/')[1] || '0', 10);

async function load() {
  if (!matchId) {
    $('#root').innerHTML = '<div class="card p-6 text-rose-400">Match ID không hợp lệ</div>';
    return;
  }
  const [d, allMeta] = await Promise.all([api(`/api/matches/${matchId}`), loadTeams()]);
  const { fixture: f, stats: s, h2h, recent_a: rA, recent_b: rB, ctx } = d;
  const nameA = ctx.nameA_vi || f.home, nameB = ctx.nameB_vi || f.away;
  document.title = `M${f.match}: ${nameA} vs ${nameB}`;

  // Header (works for both group + knockout)
  const headerHTML = `
    <a href="${f.stage === 'group' ? '/groups' : '/bracket'}" class="text-emerald-400 text-sm hover:underline">← ${f.stage === 'group' ? 'Tất cả bảng đấu' : 'Bracket knockout'}</a>
    <section class="card p-6 sm:p-8 mt-4 mb-6">
      <div class="text-center">
        <div class="text-xs text-emerald-400 uppercase tracking-wider font-bold mb-1">Match #${f.match} · ${ctx.stage_name}${f.group ? ' · Bảng ' + f.group : ''}</div>
        <div class="flex items-center justify-around gap-4 mt-4 mb-4">
          <div class="flex-1">
            <div class="text-5xl sm:text-7xl">${ctx.flagA}</div>
            ${f.is_placeholder
              ? `<div class="mt-2 font-bold text-lg text-slate-300">${escapeHtml(f.home_slot)}</div>`
              : `<a href="/team/${encodeURIComponent(f.home)}" class="block mt-2 font-bold text-lg text-slate-100 hover:text-emerald-300 no-underline">${escapeHtml(nameA)}</a>`
            }
          </div>
          <div class="text-slate-400 text-2xl">vs</div>
          <div class="flex-1">
            <div class="text-5xl sm:text-7xl">${ctx.flagB}</div>
            ${f.is_placeholder
              ? `<div class="mt-2 font-bold text-lg text-slate-300">${escapeHtml(f.away_slot)}</div>`
              : `<a href="/team/${encodeURIComponent(f.away)}" class="block mt-2 font-bold text-lg text-slate-100 hover:text-emerald-300 no-underline">${escapeHtml(nameB)}</a>`
            }
          </div>
        </div>
        <div class="text-sm text-slate-300 font-medium">
          <span class="text-emerald-300 font-mono text-lg">${f.time_vn || '--:--'}</span> ${fmtDateVN(f.date_vn)} <span class="text-slate-500">(giờ VN, GMT+7)</span>
        </div>
        <div class="text-xs text-slate-500 mt-1">${f.ground} · giờ địa phương ${f.time}</div>
      </div>
    </section>
  `;

  // Placeholder match (knockout TBD)
  if (f.is_placeholder) {
    $('#root').innerHTML = headerHTML + `
      <section class="card p-6 text-center">
        <div class="text-slate-400 mb-2">Đội tuyển sẽ được xác định sau khi vòng bảng kết thúc.</div>
        <div class="text-xs text-slate-500">Slot home: <b>${escapeHtml(f.home_slot)}</b> · Slot away: <b>${escapeHtml(f.away_slot)}</b></div>
        <a href="/bracket" class="inline-block mt-4 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 rounded-xl px-4 py-2 text-sm text-emerald-300 no-underline">Xem full bracket →</a>
      </section>
    `;
    return;
  }

  const winnerBaselineText = s.prob_a > s.prob_d && s.prob_a > s.prob_b ? `${ctx.flagA} ${nameA}`
                          : s.prob_b > s.prob_d ? `${ctx.flagB} ${nameB}` : 'Hòa';
  const topScoresStr = s.top_scores.slice(0, 3).map(t => `<span class="pill pill-slate">${t.score} (${t.prob}%)</span>`).join(' ');
  const h2hRows = h2h.matches.slice(0, 10).map(m => `
    <tr>
      <td class="text-xs text-slate-500">${m.date}</td>
      <td>${escapeHtml(m.home)} <span class="font-mono">${m.score_home}-${m.score_away}</span> ${escapeHtml(m.away)}</td>
      <td class="text-xs text-slate-500">${tournamentBadge(m.tournament)}</td>
    </tr>
  `).join('');

  $('#root').innerHTML = headerHTML + `
    <section class="card p-5 sm:p-6 mb-6">
      <h2 class="font-bold text-lg text-emerald-300 mb-3">Stats Baseline</h2>
      <div class="flex items-center justify-between gap-3 mb-3 flex-wrap">
        <div>
          <div class="text-xs text-slate-400 uppercase tracking-wider">Dự đoán</div>
          <div class="font-bold text-emerald-300 text-lg">${winnerBaselineText}</div>
        </div>
        <div class="text-center">
          <div class="text-xs text-slate-400 uppercase tracking-wider">Tỉ số kỳ vọng</div>
          <div class="font-mono font-black text-2xl text-slate-100">${s.expected_score.a} - ${s.expected_score.b}</div>
        </div>
        <div class="text-right">
          <div class="text-xs text-slate-400 uppercase tracking-wider">Top 3 tỉ số</div>
          <div class="text-xs mt-1">${topScoresStr}</div>
        </div>
      </div>
      ${probBar(s.prob_a, s.prob_d, s.prob_b)}
      <div class="flex justify-between text-[11px] mt-1 text-slate-400">
        <span class="text-emerald-400 font-semibold">${escapeHtml(nameA)} ${s.prob_a}%</span>
        <span>Hòa ${s.prob_d}%</span>
        <span class="text-blue-400 font-semibold">${s.prob_b}% ${escapeHtml(nameB)}</span>
      </div>
    </section>

    <section class="card p-5 sm:p-6 mb-6" id="aiSection">
      <div class="flex items-center justify-between mb-3 gap-3 flex-wrap">
        <h2 class="font-bold text-lg text-emerald-300">AI Dự đoán</h2>
        <button id="aiBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-lg px-4 py-2 text-sm">Tạo dự đoán AI</button>
      </div>
      <div id="aiBody" class="text-sm text-slate-400">Click nút trên để xem dự đoán AI cho trận này — phân tích phong độ, lịch sử đối đầu và cầu thủ chủ chốt.</div>
    </section>

    <section class="grid md:grid-cols-2 gap-4 mb-6">
      <div class="card p-5">
        <h3 class="font-bold text-emerald-300 mb-3">Phong độ ${escapeHtml(nameA)}</h3>
        <div class="text-sm text-slate-300 mb-2">${rA.wins}W - ${rA.draws}D - ${rA.losses}L (${Math.round(rA.win_rate * 100)}%)</div>
        <div class="text-xs text-slate-500">${rA.matches.length} trận gần nhất từ 2020</div>
      </div>
      <div class="card p-5">
        <h3 class="font-bold text-blue-300 mb-3">Phong độ ${escapeHtml(nameB)}</h3>
        <div class="text-sm text-slate-300 mb-2">${rB.wins}W - ${rB.draws}D - ${rB.losses}L (${Math.round(rB.win_rate * 100)}%)</div>
        <div class="text-xs text-slate-500">${rB.matches.length} trận gần nhất từ 2020</div>
      </div>
    </section>

    <section class="card p-5">
      <h2 class="font-bold text-lg text-emerald-300 mb-3">Đối đầu lịch sử (${h2h.total} trận, ${escapeHtml(nameA)} ${h2h.a_wins}W - ${h2h.draws}D - ${h2h.b_wins}L)</h2>
      ${h2h.total === 0 ? '<div class="text-slate-500 text-sm">Chưa từng gặp nhau.</div>' : `
        <div class="overflow-x-auto scrollbar">
          <table class="data">
            <thead><tr><th>Ngày</th><th>Trận</th><th>Giải</th></tr></thead>
            <tbody>${h2hRows}</tbody>
          </table>
        </div>
      `}
    </section>
  `;

  $('#aiBtn').addEventListener('click', async () => {
    const btn = $('#aiBtn'), body = $('#aiBody');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Đang phân tích...';

    // Progressive status messages (5 giai đoạn, tổng 5-7s) tạo cảm giác AI đang xử lý
    const stages = [
      { delay: 0,    msg: 'Đang đọc dữ liệu trận đấu...' },
      { delay: 900,  msg: 'Đang phân tích lịch sử đối đầu (H2H)...' },
      { delay: 2100, msg: 'Đang tính toán mô hình Elo + Poisson...' },
      { delay: 3500, msg: 'Đang đánh giá phong độ và cầu thủ chủ chốt...' },
      { delay: 4800, msg: 'Đang tổng hợp dự đoán cuối cùng...' },
    ];
    const stageTimers = stages.map(s => setTimeout(() => {
      body.innerHTML = `<div class="flex items-center gap-2 text-slate-500"><span class="spinner"></span><span>${s.msg}</span></div>`;
    }, s.delay));
    // Random total duration 5.5–7s để có cảm giác tự nhiên
    const minDelay = 5500 + Math.floor(Math.random() * 1500);
    const delayPromise = new Promise(r => setTimeout(r, minDelay));

    try {
      // Fetch + min delay chạy song song — chỉ render khi CẢ HAI xong
      const [res] = await Promise.all([
        fetch(`/api/predict/${matchId}`, { method: 'POST' }),
        delayPromise,
      ]);
      stageTimers.forEach(clearTimeout);
      if (!res.ok) {
        const err = await res.json();
        body.innerHTML = `<div class="text-rose-400">${escapeHtml(err.error)}</div><div class="text-xs text-slate-500 mt-2">Trận này hiện chưa có dự đoán sẵn.</div>`;
        return;
      }
      const r = await res.json();
      const p = r.prediction;
      const sim = r.simulation; // mô phỏng (nếu có) — thay đổi mỗi lần tải
      // Xác suất hiển thị: ưu tiên mô phỏng
      const Pa = sim ? sim.prob_a : p.prob_a, Pd = sim ? sim.prob_draw : p.prob_draw, Pb = sim ? sim.prob_b : p.prob_b;
      // Người thắng LUÔN theo lõi tĩnh (khớp với phần phân tích) — chỉ tỉ số & % dao động
      const wKey = p.winner === 'Hòa' ? 'draw' : (p.winner === f.home ? 'home' : 'away');
      const winner = wKey === 'draw' ? 'Hòa' : (wKey === 'home' ? ctx.flagA + ' ' + nameA : ctx.flagB + ' ' + nameB);
      // Tỉ số: random 1 tỉ số từ scorelines mô phỏng (mỗi click 1 kết quả khác nhau)
      let scoreMain;
      if (sim && sim.scorelines?.length) {
        const pick = sim.scorelines[Math.floor(Math.random() * sim.scorelines.length)];
        scoreMain = pick.label.replace('-', ' - ');
      } else {
        scoreMain = sim ? sim.primary.label.replace('-', ' - ') : `${p.score_a} - ${p.score_b}`;
      }
      body.innerHTML = `
        <div class="flex items-center justify-between gap-3 mb-3 flex-wrap">
          <div><div class="text-xs text-slate-400 uppercase">AI dự đoán${sim ? ' · mô phỏng' : ''}</div><div class="font-bold text-emerald-300">${winner} · tin cậy ${p.confidence}%</div></div>
          <div class="text-center">
            <div class="text-xs text-slate-400 uppercase">Tỉ số</div>
            <div class="font-mono font-black text-2xl">${scoreMain}</div>
          </div>
        </div>
        ${probBar(Pa, Pd, Pb)}
        <div class="flex justify-between text-[11px] mt-1 text-slate-400">
          <span class="text-emerald-400 font-semibold">${escapeHtml(nameA)} ${Pa}%</span>
          <span>Hòa ${Pd}%</span>
          <span class="text-blue-400 font-semibold">${Pb}% ${escapeHtml(nameB)}</span>
        </div>
        <div class="flex flex-wrap gap-1.5 mt-3">${(p.key_factors || []).map(k => `<span class="pill">${escapeHtml(k)}</span>`).join('')}</div>
        <div class="grid sm:grid-cols-3 gap-3 mt-4 text-xs">
          <div class="card-flat p-3"><div class="font-bold text-emerald-300 mb-1">Phong độ</div>${escapeHtml(p.analysis_form || '')}</div>
          <div class="card-flat p-3"><div class="font-bold text-emerald-300 mb-1">Lịch sử</div>${escapeHtml(p.analysis_history || '')}</div>
          <div class="card-flat p-3"><div class="font-bold text-emerald-300 mb-1">Dự đoán</div>${escapeHtml(p.analysis_prediction || '')}</div>
        </div>
        ${r.env && r.env.available ? `
        <div class="card-flat p-3 mt-3 text-xs">
          <div class="font-bold text-amber-300 mb-1">🌡️ Điều kiện thi đấu — ${escapeHtml(r.env.city)} · ${escapeHtml(r.env.daypart)}</div>
          <div class="flex flex-wrap gap-x-4 gap-y-1 text-slate-300">
            <span>Nhiệt độ ~<b>${r.env.temp_felt_c}°C</b></span>
            <span>Độ ẩm ${r.env.humidity}%</span>
            <span>Heat-stress: <b>${escapeHtml(r.env.heat_stress)}</b></span>
            <span>Độ cao ${r.env.altitude_m}m (${escapeHtml(r.env.altitude_level)})</span>
            <span>Sân: ${escapeHtml(r.env.cover)}</span>
          </div>
          ${(r.env.notes || []).length ? `<ul class="mt-2 space-y-0.5 text-slate-400">${r.env.notes.map(n => `<li>• ${escapeHtml(n)}</li>`).join('')}</ul>` : ''}
        </div>` : ''}
        ${r.source === 'claude-static'
          ? `<div class="text-xs text-slate-500 mt-2">⚡ Dự đoán sẵn bởi AI Chuyên gia bóng đá</div>`
          : (r.cached ? '<div class="text-xs text-slate-500 mt-2">Cached</div>' : '')}
      `;
    } catch (e) {
      stageTimers.forEach(clearTimeout);
      body.innerHTML = `<div class="text-rose-400">Lỗi: ${escapeHtml(e.message)}</div>`;
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Dự đoán lại';
    }
  });
}

load().catch(e => {
  $('#root').innerHTML = `<div class="card p-6 text-rose-400">Lỗi: ${e.message}</div>`;
});
</script>
</body>
</html>
