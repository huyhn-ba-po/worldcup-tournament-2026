<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lịch vòng bảng — WC2026 Predictor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tw.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
</head>
<body>
<div id="nav"></div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
  <h1 class="text-3xl sm:text-4xl font-black mb-2">Lịch vòng bảng (12 bảng A-L)</h1>
  <p class="text-slate-400 text-sm mb-6">48 đội · 72 trận vòng bảng · Giờ Việt Nam (GMT+7). Click vào trận để xem AI dự đoán.</p>

  <div id="groupsGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
    <div class="card p-6 skeleton h-64"></div>
    <div class="card p-6 skeleton h-64"></div>
    <div class="card p-6 skeleton h-64"></div>
  </div>
</main>

<div id="footer"></div>

<script type="module">
import { mountLayout, api, escapeHtml, $, teamLink, tierBadge, fmtDateVN } from '/js/shared.js?v=17';
mountLayout('/groups');

Promise.all([api('/api/teams'), api('/api/matches?stage=group')]).then(([ts, mx]) => {
  const meta = Object.fromEntries(ts.teams.map(t => [t.name, t]));
  const byGroup = {};
  ts.teams.forEach(t => {
    const fxt = mx.matches.find(f => f.home === t.name || f.away === t.name);
    const g = fxt?.group;
    if (g) (byGroup[g] = byGroup[g] || []).push(t);
  });

  const html = Object.keys(byGroup).sort().map(g => {
    const teams = byGroup[g].sort((a, b) => b.elo - a.elo);
    const matches = mx.matches.filter(f => f.group === g).sort((a, b) => a.match - b.match);
    return `
      <section class="card p-5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-bold text-lg flex items-center gap-2">
            <span class="text-xs font-bold text-slate-950 bg-emerald-400 rounded-md px-2 py-0.5">BẢNG ${g}</span>
          </h2>
          <span class="text-xs text-slate-500">6 trận</span>
        </div>
        <ul class="space-y-1.5 mb-4 text-sm">
          ${teams.map(t => `
            <li class="flex items-center gap-2">
              <span class="flag">${t.flag}</span>
              <a href="/team/${encodeURIComponent(t.name)}" class="text-slate-200 hover:text-emerald-300 no-underline">${escapeHtml(t.name_vi)}</a>
              <span class="ml-auto flex items-center gap-1.5">
                <span class="text-xs text-slate-500">${t.confederation}</span>
                ${tierBadge(t.rank_tier)}
                <span class="text-xs font-mono text-emerald-300">${t.elo}</span>
              </span>
            </li>
          `).join('')}
        </ul>
        <div class="border-t border-slate-700/40 pt-3">
          <div class="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-2">Lịch đấu (giờ VN)</div>
          <div class="space-y-1">
            ${matches.map(m => {
              const mA = meta[m.home] || {}, mB = meta[m.away] || {};
              const nA = escapeHtml(mA.name_vi || m.home), nB = escapeHtml(mB.name_vi || m.away);
              const fA = mA.flag || '🏳️', fB = mB.flag || '🏳️';
              const r = m.result;
              let aiTag = '';
              if (r && m.ai) {
                const aw = r.home > r.away ? 'home' : (r.home < r.away ? 'away' : 'draw');
                const pw = m.ai.winner === 'Hòa' ? 'draw' : (m.ai.winner === m.home ? 'home' : 'away');
                const n = (aw === pw ? 1 : 0) + ((m.ai.score_a === r.home && m.ai.score_b === r.away) ? 1 : 0);
                const cls = n === 2 ? 'bg-emerald-500/15 text-emerald-300' : (n === 1 ? 'bg-amber-500/15 text-amber-400' : 'bg-rose-500/15 text-rose-400');
                aiTag = `<span class="text-[9px] px-1 rounded ${cls} whitespace-nowrap">AI ${n}/2</span>`;
              }
              const teamsLine = r
                ? `${fA} ${nA} <b class="font-mono text-emerald-300">${r.home}-${r.away}</b> ${nB} ${fB}`
                : `${fA} ${nA} <span class="text-slate-400">vs</span> ${nB} ${fB}`;
              return `
                <a href="/match/${m.match}" class="match-row block rounded-md border border-slate-700/40 p-2 text-xs hover:border-emerald-500/40 transition no-underline">
                  <div class="flex items-center gap-2">
                    <span class="font-mono bg-slate-800 text-emerald-300 rounded px-1 py-0.5 text-[10px]">M${m.match}</span>
                    <span class="text-slate-200 truncate flex-1">${teamsLine}</span>
                    ${aiTag}
                  </div>
                  <div class="text-[10px] text-slate-500 mt-0.5">${r ? '<span class="text-slate-400">Kết thúc</span>' : (m.time_vn || '--:--') + ' ' + fmtDateVN(m.date_vn)} · ${m.ground}</div>
                </a>
              `;
            }).join('')}
          </div>
        </div>
      </section>
    `;
  }).join('');
  $('#groupsGrid').innerHTML = html;
}).catch(e => {
  $('#groupsGrid').innerHTML = '<div class="text-rose-400">Lỗi tải data</div>';
  console.error(e);
});
</script>
</body>
</html>
