<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xếp hạng — WC2026 Predictor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
</head>
<body>
<div id="nav"></div>

<main class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
  <h1 class="text-3xl sm:text-4xl font-black mb-2">Xếp hạng WC2026</h1>
  <p class="text-slate-400 text-sm mb-6">Elo rating + WCOI (Overperformance Index) cho 48 đội tham dự.</p>

  <section class="card p-5 mb-6">
    <h2 class="font-bold text-lg text-emerald-300 mb-3">Elo Rating Leaderboard</h2>
    <div id="eloTable" class="overflow-x-auto scrollbar"></div>
  </section>

  <section class="grid md:grid-cols-2 gap-5">
    <div class="card p-5">
      <h2 class="font-bold text-lg text-emerald-300 mb-3">Top WC Overperformers</h2>
      <p class="text-xs text-slate-400 mb-3">Đá hay hơn lúc vào WC vs phong độ chung (≥5 trận WC)</p>
      <div id="wcoiTop"></div>
    </div>
    <div class="card p-5">
      <h2 class="font-bold text-lg text-rose-300 mb-3">Top WC Underperformers</h2>
      <p class="text-xs text-slate-400 mb-3">Đá kém hơn lúc vào WC</p>
      <div id="wcoiBottom"></div>
    </div>
  </section>
</main>

<div id="footer"></div>

<script type="module">
import { mountLayout, api, escapeHtml, $, tierBadge } from '/js/shared.js?v=3';
mountLayout('/leaderboard');

api('/api/leaderboard').then(d => {
  $('#eloTable').innerHTML = `
    <table class="data text-sm">
      <thead><tr><th>#</th><th>Đội</th><th>Liên đoàn</th><th>Tier</th><th class="text-right">Elo</th><th class="text-right">Attack</th><th class="text-right">Defense</th><th class="text-right">WCOI</th></tr></thead>
      <tbody>
        ${d.elo.map((t, i) => `
          <tr>
            <td class="text-slate-500 font-mono text-xs">${i + 1}</td>
            <td><a href="/team/${encodeURIComponent(t.name)}" class="text-emerald-300 hover:text-emerald-200 no-underline"><span class="flag mr-1">${t.flag}</span>${escapeHtml(t.name_vi)}</a> ${t.is_host ? '<span class="pill pill-amber ml-1">Chủ nhà</span>' : ''}</td>
            <td class="text-xs text-slate-400">${t.confederation}</td>
            <td>${tierBadge(t.rank_tier)}</td>
            <td class="text-right font-mono font-bold text-emerald-300">${t.elo}</td>
            <td class="text-right font-mono text-xs">${t.attack}</td>
            <td class="text-right font-mono text-xs">${t.defense}</td>
            <td class="text-right font-mono text-xs ${t.wcoi > 0 ? 'text-emerald-300' : t.wcoi < 0 ? 'text-rose-300' : 'text-slate-400'}">${t.wcoi > 0 ? '+' : ''}${t.wcoi}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  $('#wcoiTop').innerHTML = d.wcoi_top.map(t => `
    <div class="flex items-center justify-between py-1.5 text-sm border-b border-slate-800/40 last:border-0">
      <a href="/team/${encodeURIComponent(t.team)}" class="text-slate-200 hover:text-emerald-300 no-underline">${escapeHtml(t.name_vi || t.team)}</a>
      <span class="flex items-center gap-3 text-xs">
        <span class="text-slate-500">WC ${Math.round(t.wc_win_rate * 100)}% / All ${Math.round(t.all_win_rate * 100)}%</span>
        <span class="font-mono font-bold text-emerald-300">+${t.wcoi.toFixed(3)}</span>
      </span>
    </div>
  `).join('');

  $('#wcoiBottom').innerHTML = d.wcoi_bottom.map(t => `
    <div class="flex items-center justify-between py-1.5 text-sm border-b border-slate-800/40 last:border-0">
      <a href="/team/${encodeURIComponent(t.team)}" class="text-slate-200 hover:text-emerald-300 no-underline">${escapeHtml(t.name_vi || t.team)}</a>
      <span class="flex items-center gap-3 text-xs">
        <span class="text-slate-500">WC ${Math.round(t.wc_win_rate * 100)}% / All ${Math.round(t.all_win_rate * 100)}%</span>
        <span class="font-mono font-bold text-rose-300">${t.wcoi.toFixed(3)}</span>
      </span>
    </div>
  `).join('');
}).catch(e => { $('#eloTable').innerHTML = `<div class="text-rose-400">${e.message}</div>`; });
</script>
</body>
</html>
