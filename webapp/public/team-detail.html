<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đội tuyển — WC2026 Predictor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
</head>
<body>
<div id="nav"></div>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-8" id="root">
  <div class="skeleton h-32 rounded-2xl mb-6"></div>
  <div class="skeleton h-48 rounded-2xl"></div>
</main>

<div id="footer"></div>

<script type="module">
import { mountLayout, api, escapeHtml, $, tierBadge, fmtDateVN, loadTeams } from '/js/shared.js?v=12';
mountLayout('/team');

function renderSquad(squad) {
  if (!squad || squad.error) {
    return `<section class="card p-5 mb-6">
      <h2 class="font-bold text-lg text-emerald-300 mb-1">Đội hình</h2>
      <p class="text-sm text-slate-500">Chưa có dữ liệu đội hình cho đội này.</p>
    </section>`;
  }
  const cats = [
    { key: 'goalkeepers', label: 'Thủ môn', color: 'text-amber-300' },
    { key: 'defenders', label: 'Hậu vệ', color: 'text-blue-300' },
    { key: 'midfielders', label: 'Tiền vệ', color: 'text-emerald-300' },
    { key: 'forwards', label: 'Tiền đạo', color: 'text-rose-300' },
  ];
  const renderPlayer = (p) => `
    <div class="flex items-center justify-between py-1.5 px-2 hover:bg-emerald-500/5 rounded text-sm">
      <div class="min-w-0 flex-1">
        <div class="font-semibold text-slate-100 truncate">
          ${p.no ? `<span class="text-xs text-slate-500 font-mono mr-2">#${p.no}</span>` : ''}
          ${escapeHtml(p.name)}
          ${p.age ? `<span class="text-xs text-slate-500 ml-1">(${p.age}t)</span>` : ''}
        </div>
        ${p.club ? `<div class="text-xs text-slate-500 truncate">${escapeHtml(p.club)}</div>` : ''}
      </div>
      <div class="text-right text-xs ml-2 shrink-0">
        ${p.caps != null ? `<span class="font-mono text-emerald-300">${p.caps}</span><span class="text-slate-500"> caps</span>` : ''}
        ${p.goals ? ` · <span class="font-mono text-amber-300">${p.goals}</span><span class="text-slate-500"> bàn</span>` : ''}
      </div>
    </div>
  `;
  return `<section class="card p-5 mb-6">
    <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
      <h2 class="font-bold text-lg text-emerald-300">Đội hình (${squad.total} cầu thủ)</h2>
      <span class="text-xs text-slate-500">Nguồn: <a href="${squad.source_url}" target="_blank" rel="noopener" class="text-emerald-400 hover:underline">Wikipedia</a></span>
    </div>
    <p class="text-xs text-amber-300/80 mb-4">⚠️ Đội hình hiện tại từ qualifiers/friendlies. Squad WC2026 26-man chính thức sẽ công bố cuối tháng 5/2026.</p>

    ${squad.key_players?.length ? `
      <div class="mb-5 p-4 rounded-xl bg-gradient-to-r from-emerald-500/5 to-blue-500/5 border border-emerald-500/20">
        <div class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2">⭐ Cầu thủ chủ chốt (top 7 theo caps + goals)</div>
        <div class="space-y-1">${squad.key_players.map(renderPlayer).join('')}</div>
      </div>
    ` : ''}

    <div class="grid sm:grid-cols-2 gap-4">
      ${cats.map(c => {
        const players = squad.by_position?.[c.key] || [];
        if (!players.length) return '';
        return `<div>
          <div class="font-bold ${c.color} text-sm mb-2 uppercase tracking-wider">${c.label} <span class="text-slate-500 text-xs">(${players.length})</span></div>
          <div class="space-y-0.5">${players.map(renderPlayer).join('')}</div>
        </div>`;
      }).join('')}
    </div>
  </section>`;
}

const teamName = decodeURIComponent(window.location.pathname.split('/team/')[1] || '');

if (!teamName) {
  $('#root').innerHTML = '<div class="card p-6 text-rose-400">Không có tên đội. <a href="/teams" class="text-emerald-400">Quay lại danh sách</a></div>';
} else {
  Promise.all([api(`/api/teams/${encodeURIComponent(teamName)}`), loadTeams()]).then(([d, allMeta]) => {
    const t = d.team;
    document.title = `${t.name_vi} — WC2026 Predictor`;
    const formMatches = d.recent_form.matches.map(m => {
      const opp = allMeta[m.opponent]?.name_vi || m.opponent;
      const me = t.name_vi;
      return `<tr>
        <td class="text-xs text-slate-500">${m.date}</td>
        <td>${escapeHtml(m.is_home ? me : opp)} <span class="font-mono font-bold ${m.gf > m.ga ? 'text-emerald-300' : m.gf < m.ga ? 'text-rose-300' : 'text-slate-400'}">${m.gf}-${m.ga}</span> ${escapeHtml(m.is_home ? opp : me)}</td>
        <td class="text-xs text-slate-500">${escapeHtml(m.tournament)}</td>
      </tr>`;
    }).join('');

    const wcHistory = d.wc_history.slice(0, 30).map(m => {
      const score = m.score?.ft || [];
      return `<tr>
        <td class="text-xs text-slate-500">${m.year}</td>
        <td>${escapeHtml(m.team1)} <span class="font-mono">${score[0] ?? '?'}-${score[1] ?? '?'}</span> ${escapeHtml(m.team2)}</td>
        <td class="text-xs text-slate-500">${escapeHtml(m.round || '')}</td>
      </tr>`;
    }).join('');

    const groupMatches = d.group_matches.map(m => {
      const mA = allMeta[m.home] || {}, mB = allMeta[m.away] || {};
      return `<a href="/match/${m.match}" class="match-row block rounded-md border border-slate-700/40 p-2 text-xs hover:border-emerald-500/40 transition no-underline">
        <span class="font-mono bg-slate-800 text-emerald-300 rounded px-1 py-0.5 text-[10px]">M${m.match}</span>
        <span class="ml-2 text-slate-200">${escapeHtml(mA.name_vi || m.home)} vs ${escapeHtml(mB.name_vi || m.away)}</span>
        <span class="ml-2 text-slate-500">${m.time_vn || ''} ${fmtDateVN(m.date_vn)} · ${m.ground}</span>
      </a>`;
    }).join('');

    $('#root').innerHTML = `
      <a href="/teams" class="text-emerald-400 text-sm hover:underline">← Tất cả đội</a>
      <section class="card p-6 sm:p-8 mt-4 mb-6">
        <div class="flex items-start gap-6 flex-wrap">
          <div class="text-7xl sm:text-8xl">${t.flag}</div>
          <div class="flex-1 min-w-0">
            <h1 class="text-3xl sm:text-4xl font-black">${escapeHtml(t.name_vi)}</h1>
            <div class="text-sm text-slate-400 mt-1">${escapeHtml(t.name)}</div>
            <div class="mt-3 flex flex-wrap gap-2">
              <span class="pill">${t.confederation}</span>
              ${tierBadge(t.rank_tier)}
              <span class="pill pill-slate">Bảng ${d.group}</span>
              ${t.titles > 0 ? `<span class="pill pill-amber">${t.titles} chức VĐ WC</span>` : ''}
              ${t.is_host ? `<span class="pill pill-amber">Chủ nhà</span>` : ''}
            </div>
          </div>
          <div class="text-right">
            <div class="text-xs text-slate-400 uppercase tracking-wider">Elo Rating</div>
            <div class="text-4xl font-black text-emerald-300 font-mono">${t.elo}</div>
          </div>
        </div>
      </section>

      <section class="grid sm:grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <div class="card p-4">
          <div class="text-xs text-slate-400 uppercase tracking-wider">Attack (α)</div>
          <div class="text-2xl font-black text-emerald-300 mt-1">${t.attack}</div>
          <div class="text-xs text-slate-500">${t.gf_per_match}/trận</div>
        </div>
        <div class="card p-4">
          <div class="text-xs text-slate-400 uppercase tracking-wider">Defense (δ)</div>
          <div class="text-2xl font-black text-blue-300 mt-1">${t.defense}</div>
          <div class="text-xs text-slate-500">${t.ga_per_match}/trận</div>
        </div>
        <div class="card p-4">
          <div class="text-xs text-slate-400 uppercase tracking-wider">WCOI</div>
          <div class="text-2xl font-black mt-1 ${t.wcoi > 0 ? 'text-emerald-300' : t.wcoi < 0 ? 'text-rose-300' : 'text-slate-400'}">${t.wcoi > 0 ? '+' : ''}${t.wcoi}</div>
          <div class="text-xs text-slate-500">${t.wc_matches} trận WC</div>
        </div>
        <div class="card p-4">
          <div class="text-xs text-slate-400 uppercase tracking-wider">Phong độ 10</div>
          <div class="text-2xl font-black text-emerald-300 mt-1">${d.recent_form.wins}-${d.recent_form.draws}-${d.recent_form.losses}</div>
          <div class="text-xs text-slate-500">Win rate ${Math.round(d.recent_form.win_rate * 100)}%</div>
        </div>
      </section>

      <section class="card p-5 mb-6">
        <h2 class="font-bold text-lg text-emerald-300 mb-3">Lịch đấu vòng bảng (giờ VN)</h2>
        <div class="space-y-2">${groupMatches}</div>
      </section>

      ${renderSquad(d.squad)}

      <section class="card p-5 mb-6">
        <h2 class="font-bold text-lg text-emerald-300 mb-3">10 trận quốc tế gần nhất (2020+)</h2>
        <div class="overflow-x-auto scrollbar">
          <table class="data">
            <thead><tr><th>Ngày</th><th>Trận</th><th>Giải</th></tr></thead>
            <tbody>${formMatches || '<tr><td colspan="3" class="text-slate-500 text-center">Không có dữ liệu</td></tr>'}</tbody>
          </table>
        </div>
      </section>

      <section class="card p-5">
        <h2 class="font-bold text-lg text-emerald-300 mb-3">Lịch sử World Cup (max 30 trận gần nhất)</h2>
        <div class="overflow-x-auto scrollbar">
          <table class="data">
            <thead><tr><th>Năm</th><th>Trận</th><th>Vòng</th></tr></thead>
            <tbody>${wcHistory || '<tr><td colspan="3" class="text-slate-500 text-center">Chưa từng dự WC</td></tr>'}</tbody>
          </table>
        </div>
      </section>
    `;
  }).catch(e => {
    $('#root').innerHTML = `<div class="card p-6 text-rose-400">Lỗi: ${e.message}</div>`;
  });
}
</script>
</body>
</html>
